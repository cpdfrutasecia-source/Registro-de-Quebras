<script>
    // ============================================================
    // URL DO CSV DA PLANILHA DE PRODUTOS
    // ============================================================
    const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQRhvQFKwwde7gCktDWXJJ-3G3eETE51T6JhptQr-9DqgADIKdvt7YpPQByY8ksRthvIMdNNhuRKuo2/pub?gid=0&single=true&output=csv';

    // ============================================================
    // URL DO APPS SCRIPT (HISTÓRICO DE QUEBRAS)
    // ============================================================
    const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbz1jgZfxN68852c6OjZSJspAxpbvENXEHWV-cQuH6s_46e6b-trTU0LQbn49ZuG99IC/exec';

    // ============================================================
    // CATÁLOGO DE FALLBACK
    // ============================================================
    const catalogoFallback = [
        { sku: '1', codbarra: '1', descricao: 'ABACATE KG', unidade: 'KG', fator: 18 },
        { sku: '2', codbarra: '2', descricao: 'ABACATE BREDA KG', unidade: 'UN', fator: 1 },
        { sku: '3', codbarra: '3', descricao: 'ABACATE FORTUNE KG', unidade: 'UN', fator: 18 },
        { sku: '4', codbarra: '4', descricao: 'ABACAXI HAWAI UN', unidade: 'UN', fator: 1 },
        { sku: '5', codbarra: '5', descricao: 'ABACAXI PEROLA UN', unidade: 'UN', fator: 5 },
        { sku: '6', codbarra: '6', descricao: 'ABACAXI PICADO POT150G', unidade: 'UN', fator: 1 }
    ];

    // ============================================================
    // VARIÁVEIS GLOBAIS
    // ============================================================
    let catalogo = [];
    let itens = [];
    let editandoIndex = null;

    // ============================================================
    // REFERÊNCIAS DOM
    // ============================================================
    const codigoInput = document.getElementById('codigoProd');
    const descInput = document.getElementById('descProd');
    const tipoSelect = document.getElementById('tipoProd');
    const motivoSelect = document.getElementById('motivoProd');
    const qtdInput = document.getElementById('qtdProd');
    const unidadeInput = document.getElementById('unidadeProd');
    const pesquisaInput = document.getElementById('pesquisaProduto');
    const suggestionsDiv = document.getElementById('suggestionsPesquisa');
    const btnAdicionar = document.getElementById('btnAdicionar');
    const btnSalvarEdicao = document.getElementById('btnSalvarEdicao');
    const statusTexto = document.getElementById('statusTexto');

    // ============================================================
    // PARSER DE CSV QUE RESPEITA ASPAS
    // ============================================================
    function parseCSVLine(line, sep) {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (inQuotes) {
                if (c === '"') {
                    if (line[i + 1] === '"') { cur += '"'; i++; }
                    else { inQuotes = false; }
                } else {
                    cur += c;
                }
            } else {
                if (c === '"') {
                    inQuotes = true;
                } else if (c === sep) {
                    result.push(cur);
                    cur = '';
                } else {
                    cur += c;
                }
            }
        }
        result.push(cur);
        return result;
    }

    // ============================================================
    // CARREGAR CATÁLOGO DO CSV
    // ============================================================
    async function carregarCatalogo() {
        try {
            statusTexto.textContent = '🔄 Baixando catálogo da planilha...';
            console.log('🔄 Baixando catálogo...');
            console.log('URL:', URL_CSV);

            const resposta = await fetch(URL_CSV);
            if (!resposta.ok) throw new Error(`Erro HTTP: ${resposta.status}`);

            let csv = await resposta.text();

            // Remove BOM se existir
            if (csv.charCodeAt(0) === 0xFEFF) csv = csv.slice(1);

            const linhas = csv.split(/\r?\n/).filter(l => l.trim() !== '');
            if (linhas.length === 0) throw new Error('CSV vazio');

            const primeiraLinha = linhas[0];
            // Detecta separador: vírgula ou ponto e vírgula
            const sepCount = (primeiraLinha.match(/,/g) || []).length;
            const semiCount = (primeiraLinha.match(/;/g) || []).length;
            const separador = semiCount > sepCount ? ';' : ',';

            // Cabeçalho
            const cabecalho = parseCSVLine(primeiraLinha, separador)
                .map(c => c.trim().replace(/^"|"$/g, '').toUpperCase());
            console.log('📋 Cabeçalho detectado:', cabecalho);

            // Mapeamento de índices com regex flexível
            const idx = {
                codigo:    cabecalho.findIndex(c => /^CODIGO$|^CÓDIGO$|^SKU$/.test(c)),
                codbarra:  cabecalho.findIndex(c => /CODBARRA|CODBARR|COD\.?\s*BARRAS|^BARRAS$/.test(c)),
                descricao: cabecalho.findIndex(c => /DESCRICAO|DESCRIÇÃO|^PRODUTO$/.test(c)),
                unidade:   cabecalho.findIndex(c => /^UNIDADE$|^UN$/.test(c)),
                fator:     cabecalho.findIndex(c => /FATORCX|^FATOR$/.test(c))
            };

            // Fallback posicional caso o regex falhe
            // (ordem conhecida: CODIGO, CODBARRA, DESCRICAO, UNIDADE, FATORCX, CUSTO REP)
            if (idx.codigo === -1)    idx.codigo = 0;
            if (idx.codbarra === -1)  idx.codbarra = 1;
            if (idx.descricao === -1) idx.descricao = 2;
            if (idx.unidade === -1)   idx.unidade = 3;
            if (idx.fator === -1)     idx.fator = 4;

            console.log('📍 Índices mapeados:', idx);

            const carregado = [];
            for (let i = 1; i < linhas.length; i++) {
                const cols = parseCSVLine(linhas[i], separador)
                    .map(c => c.trim().replace(/^"|"$/g, ''));
                if (cols.length <= Math.max(idx.codigo, idx.codbarra, idx.descricao)) continue;

                const codbarra = cols[idx.codbarra] || '';
                if (codbarra === '' || codbarra.toUpperCase() === 'SEM GTIN') continue;

                carregado.push({
                    sku: cols[idx.codigo] || '',
                    codbarra: codbarra,
                    descricao: cols[idx.descricao] || '',
                    unidade: cols[idx.unidade] || 'UN',
                    fator: parseInt(cols[idx.fator]) || 1
                });
            }

            if (carregado.length === 0) throw new Error('Nenhum produto válido encontrado');

            catalogo = carregado;
            statusTexto.innerHTML = `✅ Catálogo carregado: <strong>${catalogo.length}</strong> produtos (via CSV)`;
            console.log(`✅ Catálogo carregado: ${catalogo.length} produtos`);
            console.log('Exemplo (primeiros 3):', catalogo.slice(0, 3));
            return catalogo;

        } catch (erro) {
            console.error('❌ Erro ao carregar catálogo:', erro);
            catalogo = catalogoFallback;
            statusTexto.innerHTML = `⚠️ Usando fallback: <strong>${catalogo.length}</strong> produtos (erro: ${erro.message})`;
            return catalogo;
        }
    }

    async function recarregarCatalogo() {
        await carregarCatalogo();
        showToast('🔄 Catálogo recarregado!');
        const query = pesquisaInput.value.trim();
        if (query) pesquisaInput.dispatchEvent(new Event('input'));
    }

    // ============================================================
    // GERAR ID ÚNICO
    // ============================================================
    function gerarIdQuebra() {
        const now = new Date();
        const y = now.getFullYear().toString().slice(-2);
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        const h = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        const rand = String(Math.floor(Math.random() * 1000)).padStart(3, '0');
        return `QBR-${y}${m}${d}-${h}${min}${s}-${rand}`;
    }

    // ============================================================
    // DATA/HORA
    // ============================================================
    function preencherDataHora() {
        const now = new Date();
        const d = String(now.getDate()).padStart(2,'0');
        const m = String(now.getMonth()+1).padStart(2,'0');
        const y = now.getFullYear();
        const h = String(now.getHours()).padStart(2,'0');
        const min = String(now.getMinutes()).padStart(2,'0');
        document.getElementById('dataHora').value = `${d}/${m}/${y} ${h}:${min}`;
    }
    preencherDataHora();

    // ============================================================
    // PREENCHER CAMPOS
    // ============================================================
    function preencherCampos(produto) {
        if (!produto) return;
        codigoInput.value = produto.codbarra;
        descInput.value = produto.descricao;
        unidadeInput.value = produto.unidade;
    }

    // ============================================================
    // BUSCA POR CÓDIGO DE BARRAS (exata)
    // ============================================================
    codigoInput.addEventListener('blur', function() {
        const cod = this.value.trim();
        if (cod === '') {
            descInput.value = '';
            unidadeInput.value = '';
            return;
        }
        const produto = catalogo.find(p => p.codbarra === cod);
        if (produto) {
            preencherCampos(produto);
            showToast('Produto encontrado');
            if (editandoIndex === null) qtdInput.focus();
        } else {
            showToast('⚠️ Produto não encontrado');
            descInput.value = '';
            unidadeInput.value = '';
        }
    });

    codigoInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') this.blur();
    });

    // ============================================================
    // AUTOCOMPLETE POR DESCRIÇÃO
    // ============================================================
    function matchesQuery(produto, query) {
        const words = query.trim().toLowerCase().split(/\s+/).filter(w => w.length > 0);
        const text = produto.descricao.toLowerCase();
        return words.every(word => text.includes(word));
    }

    pesquisaInput.addEventListener('input', function() {
        const query = this.value.trim();
        if (query === '') {
            suggestionsDiv.classList.remove('show');
            return;
        }
        const matches = catalogo.filter(p => matchesQuery(p, query));
        if (matches.length > 0) {
            const limited = matches.slice(0, 10);
            suggestionsDiv.innerHTML = limited.map(p =>
                `<div class="suggestion"
                     data-codbarra="${p.codbarra}"
                     data-desc="${p.descricao}"
                     data-unidade="${p.unidade}">
                    <strong>${p.codbarra}</strong> — ${p.descricao} <em>(${p.unidade})</em>
                </div>`
            ).join('');
            suggestionsDiv.classList.add('show');
        } else {
            suggestionsDiv.classList.remove('show');
        }
    });

    suggestionsDiv.addEventListener('click', function(e) {
        const item = e.target.closest('.suggestion');
        if (!item) return;
        codigoInput.value = item.dataset.codbarra;
        descInput.value = item.dataset.desc;
        unidadeInput.value = item.dataset.unidade;
        suggestionsDiv.classList.remove('show');
        pesquisaInput.value = '';
        if (editandoIndex === null) qtdInput.focus();
        showToast('Produto selecionado');
    });

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-bar')) {
            suggestionsDiv.classList.remove('show');
        }
    });

    // ============================================================
    // ADICIONAR ITEM
    // ============================================================
    function adicionarItem() {
        const codbarra = codigoInput.value.trim();
        if (!codbarra) { showToast('⚠️ Selecione um produto'); return; }

        const produto = catalogo.find(p => p.codbarra === codbarra);
        if (!produto) { showToast('⚠️ Produto inválido'); return; }

        const tipo = tipoSelect.value;
        const motivo = motivoSelect.value;
        const quantidade = parseInt(qtdInput.value) || 0;

        if (quantidade <= 0) { showToast('⚠️ Quantidade deve ser > 0'); return; }

        if (editandoIndex !== null) { salvarEdicao(); return; }

        itens.push({
            sku: produto.sku,
            codbarra: produto.codbarra,
            descricao: produto.descricao,
            unidade: produto.unidade,
            tipo: tipo,
            motivo: motivo,
            quantidade: quantidade
        });

        limparCampos();
        renderizarTabela();
        showToast('✓ Item adicionado');
    }

    function limparCampos() {
        codigoInput.value = '';
        descInput.value = '';
        unidadeInput.value = '';
        qtdInput.value = '1';
        tipoSelect.value = 'Quebra';
        motivoSelect.value = 'Validade';
        codigoInput.focus();
        editandoIndex = null;
        btnAdicionar.style.display = 'inline-flex';
        btnSalvarEdicao.style.display = 'none';
        document.querySelectorAll('.add-field input, .add-field select').forEach(el => {
            el.classList.remove('edit-mode');
        });
    }

    function iniciarEdicao(index) {
        const item = itens[index];
        if (!item) return;

        editandoIndex = index;
        codigoInput.value = item.codbarra;
        descInput.value = item.descricao;
        unidadeInput.value = item.unidade;
        tipoSelect.value = item.tipo;
        motivoSelect.value = item.motivo;
        qtdInput.value = item.quantidade;

        btnAdicionar.style.display = 'none';
        btnSalvarEdicao.style.display = 'inline-flex';

        document.querySelectorAll('.add-field input, .add-field select').forEach(el => {
            el.classList.add('edit-mode');
        });

        codigoInput.focus();
        showToast('✏️ Editando item...');
    }

    function salvarEdicao() {
        if (editandoIndex === null) return;

        const codbarra = codigoInput.value.trim();
        if (!codbarra) { showToast('⚠️ Selecione um produto'); return; }

        const produto = catalogo.find(p => p.codbarra === codbarra);
        if (!produto) { showToast('⚠️ Produto inválido'); return; }

        const tipo = tipoSelect.value;
        const motivo = motivoSelect.value;
        const quantidade = parseInt(qtdInput.value) || 0;

        if (quantidade <= 0) { showToast('⚠️ Quantidade deve ser > 0'); return; }

        itens[editandoIndex] = {
            sku: produto.sku,
            codbarra: produto.codbarra,
            descricao: produto.descricao,
            unidade: produto.unidade,
            tipo: tipo,
            motivo: motivo,
            quantidade: quantidade
        };

        limparCampos();
        renderizarTabela();
        showToast('✓ Item atualizado');
    }

    function removerItem(index) {
        if (editandoIndex !== null) {
            if (!confirm('Há uma edição em andamento. Deseja cancelar e remover?')) return;
            limparCampos();
        }
        itens.splice(index, 1);
        renderizarTabela();
        showToast('Item removido');
    }

    function renderizarTabela() {
        const tbody = document.getElementById('corpoTabela');
        const totalItensSpan = document.getElementById('totalItens');
        const totalUnidadesSpan = document.getElementById('totalUnidades');
        const contadorSpan = document.getElementById('contadorItens');

        if (itens.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="empty-message">Nenhum item registrado ainda.</td></tr>`;
            totalItensSpan.textContent = '0';
            totalUnidadesSpan.textContent = '0';
            contadorSpan.textContent = '0 itens';
            return;
        }

        let html = '';
        let somaUnidades = 0;
        itens.forEach((item, index) => {
            somaUnidades += item.quantidade;
            const isEditando = (editandoIndex === index);
            html += `<tr style="${isEditando ? 'background:var(--accent-light);' : ''}">
                <td>${index + 1}</td>
                <td>${escHtml(item.descricao)}</td>
                <td>${item.tipo}</td>
                <td class="qtd-cell">${item.quantidade}</td>
                <td>${item.motivo}</td>
                <td>${item.unidade}</td>
                <td style="text-align:center;white-space:nowrap;">
                    <button class="btn-edit" onclick="iniciarEdicao(${index})" title="Editar">✏️</button>
                    <button class="btn-remove" onclick="removerItem(${index})" title="Remover">✕</button>
                </td>
            </tr>`;
        });

        tbody.innerHTML = html;
        totalItensSpan.textContent = itens.length;
        totalUnidadesSpan.textContent = somaUnidades;
        contadorSpan.textContent = `${itens.length} itens`;
    }

    function escHtml(texto) {
        if (!texto) return '';
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return texto.replace(/[&<>"']/g, m => map[m]);
    }

    function limparLista() {
        if (itens.length === 0) { showToast('Já está vazio'); return; }
        if (editandoIndex !== null) { limparCampos(); }
        if (confirm('Tem certeza que deseja limpar todos os itens?')) {
            itens = [];
            renderizarTabela();
            showToast('Lista limpa');
        }
    }

    async function salvarNoHistorico() {
        if (itens.length === 0) {
            showToast('⚠️ Nenhum item para salvar');
            return false;
        }

        const idQuebra = gerarIdQuebra();
        const dataHora = document.getElementById('dataHora').value.trim();
        const partes = dataHora.split(' ');
        const data = partes[0] || '';
        const hora = partes[1] || '';

        const dados = {
            id: idQuebra,
            data: data,
            hora: hora,
            loja: document.getElementById('loja').value,
            operador: document.getElementById('operador').value.trim() || 'Não informado',
            observacao: document.getElementById('observacao').value.trim(),
            itens: itens.map(item => ({
                descricao: item.descricao,
                codbarra: item.codbarra,
                quantidade: Number(item.quantidade),
                unidade: item.unidade,
                tipo: item.tipo,
                motivo: item.motivo
            }))
        };

        try {
            console.log('📤 Enviando para:', URL_SCRIPT);
            console.log('📦 Dados enviados:', dados);

            const urlComDados = URL_SCRIPT + '?dados=' + encodeURIComponent(JSON.stringify(dados));

            await fetch(urlComDados, { method: 'GET', mode: 'no-cors' });

            showToast('✅ Histórico enviado! Confira a planilha.');
            return true;
        } catch (erro) {
            console.error('❌ Erro ao salvar histórico:', erro);
            showToast(`⚠️ Erro ao salvar: ${erro.message}`);
            return false;
        }
    }

    async function finalizar() {
        if (itens.length === 0) {
            showToast('⚠️ Adicione pelo menos um item');
            return;
        }

        if (editandoIndex !== null) {
            if (!confirm('Há uma edição em andamento. Deseja descartá-la e finalizar?')) return;
            limparCampos();
        }

        showToast('🔄 Salvando no histórico...');

        const salvou = await salvarNoHistorico();
        if (!salvou) {
            if (!confirm('⚠️ Não foi possível salvar no histórico. Deseja continuar mesmo assim (apenas para imprimir)?')) return;
        }

        const loja = document.getElementById('loja').value;
        const operador = document.getElementById('operador').value.trim() || 'Não informado';
        const dataHora = document.getElementById('dataHora').value;
        const observacao = document.getElementById('observacao').value.trim();

        let resumo = '🍇 FRUTAS & CIA — REGISTRO DE QUEBRAS/REBAIXAS\n';
        resumo += '═'.repeat(48) + '\n';
        resumo += `Loja: ${loja}\n`;
        resumo += `Operador: ${operador}\n`;
        resumo += `Data/Hora: ${dataHora}\n`;
        if (observacao) resumo += `Obs: ${observacao}\n`;
        resumo += '─'.repeat(48) + '\n';
        resumo += `ITENS (${itens.length}):\n`;
        itens.forEach((item, i) => {
            resumo += `${i+1}. ${item.descricao} | ${item.tipo} | ${item.quantidade} ${item.unidade} | ${item.motivo}\n`;
        });
        resumo += '─'.repeat(48) + '\n';
        const totalUnidades = itens.reduce((acc, item) => acc + item.quantidade, 0);
        resumo += `Total de itens: ${itens.length}\n`;
        resumo += `Total de unidades: ${totalUnidades}\n`;
        resumo += '═'.repeat(48) + '\n';
        resumo += 'Assinatura do responsável: ___________________\n';

        alert(resumo);

        if (confirm('Deseja imprimir este registro?')) {
            window.print();
        }

        showToast('✅ Registro finalizado!');
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const active = document.activeElement;
            if (active && (active.id === 'qtdProd' || active.id === 'codigoProd' || active.id === 'descProd')) {
                e.preventDefault();
                adicionarItem();
            }
        }
    });

    (async function init() {
        await carregarCatalogo();
        renderizarTabela();
        console.log(`✅ App iniciado com ${catalogo.length} produtos`);
    })();
</script>
